name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: "22.x"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Scan committed files for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --no-banner --redact
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: python -m pip install -r requirements-cli.txt
      - run: bun run test:package
      - run: bun run check:capabilities
      - run: bun run check:release
      - run: bun run package:agent-plugin
      - run: bun run package:codex-plugin
      - run: npm pack --dry-run
