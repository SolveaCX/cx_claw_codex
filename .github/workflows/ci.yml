name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: "22.x"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Scan committed files for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --no-banner --redact
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run check:capabilities
      - run: bun run check:release

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.13"}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check:release
      - run: bun run package:agent-plugin
      - run: bun run package:codex-plugin
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPM_TOKEN is not configured; skipping npm publish."
          else
            npm publish --access public --tag latest
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "v${VERSION}" dist/cxclaw-agent-plugin.zip dist/cxclaw-agent-plugin.json dist/cxclaw-agent-plugin.sha256 dist/cxclaw-codex-plugin.zip --title "CXClaw ${VERSION}" --generate-notes
          if [[ "$VERSION" == *-canary.* ]]; then channel=canary; elif [[ "$VERSION" == *-dev.* ]]; then channel=dev; else channel=stable; fi
          git push origin "HEAD:refs/heads/marketplace/${channel}" --force
