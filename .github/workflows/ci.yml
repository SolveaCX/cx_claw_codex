name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 scripts/check_capabilities.py

  build:
    needs: test
    strategy:
      matrix:
        include:
          - {goos: darwin, goarch: amd64, suffix: ""}
          - {goos: darwin, goarch: arm64, suffix: ""}
          - {goos: windows, goarch: amd64, suffix: ".exe"}
          - {goos: linux, goarch: amd64, suffix: ""}
          - {goos: linux, goarch: arm64, suffix: ""}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/package/bin
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X github.com/SolveaCX/cx_claw_codex/internal/buildinfo.PluginVersion=$VERSION -X github.com/SolveaCX/cx_claw_codex/internal/buildinfo.CLIVersion=$VERSION -X github.com/SolveaCX/cx_claw_codex/internal/buildinfo.UpdatePublicKeyBase64=${{ vars.CXCLAW_UPDATE_PUBLIC_KEY_BASE64 }}"
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/package/bin/cxclawctl${{ matrix.suffix }}" ./cmd/cxclawctl
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/package/bin/cxclaw-launcher${{ matrix.suffix }}" ./cmd/cxclaw-launcher
          cp -R plugin.json mcp.json capabilities.lock.json README.md skills dist/package/
          cd dist/package && zip -qr "../cxclaw-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: cxclaw-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums and Ed25519 signatures
        env:
          CXCLAW_ED25519_PRIVATE_KEY_BASE64: ${{ secrets.CXCLAW_ED25519_PRIVATE_KEY_BASE64 }}
        run: |
          : > dist/releases.sha256
          : > dist/releases.sig
          for package in dist/*.zip; do
            hash="$(sha256sum "$package" | cut -d' ' -f1)"
            printf '%s  %s\n' "$hash" "$(basename "$package")" >> dist/releases.sha256
            signature="$(go run ./cmd/cxclaw-sign "$hash")"
            printf '%s  %s\n' "$signature" "$(basename "$package")" >> dist/releases.sig
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CXCLAW_RELEASE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.CXCLAW_RELEASE_AWS_REGION }}
      - name: Upload to company object storage
        run: aws s3 cp dist/ "s3://${{ vars.CXCLAW_RELEASE_BUCKET }}/cxclaw/${GITHUB_REF_NAME}/" --recursive
